<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>動くデジタル時計</title>
    <style>
      html,
      body {
        background: transparent !important;
        margin: 0;
      }
    </style>
    <link rel="stylesheet" href="clock.css" />
  </head>
  <body>
    <!-- 見た目の初期値は clock.js 先頭の CONFIG。URL のクエリがあればそちらが優先されます。 -->
    <main id="clock" class="clock theme-neon" aria-hidden="true">
      <div class="clock-float" id="float">
        <p class="period" id="period" hidden></p>
        <div class="time" id="time"></div>
        <div class="tick" aria-hidden="true"></div>
        <p class="date" id="date" hidden></p>
      </div>
    </main>
    <p class="sr-only" id="spoken" aria-live="polite"></p>
    <script src="clock.js"></script>
  </body>
</html>
