<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はじめての人へ — Discordサーバーキット</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #44403c;
      --line: #d6d3d1;
      --paper: #f6f3ee;
      --card: #fff;
      --accent: #1d4e89;
      --accent-ink: #fff;
      --warn: #fff4d6;
      --warn-line: #b45309;
      --ok: #14532d;
      --ok-bg: #ecfdf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--warn);
      border-bottom: 3px solid var(--warn-line);
    }
    .brand {
      margin: 0;
      padding: 8px 16px 0;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .rule {
      margin: 0;
      padding: 6px 16px 8px;
      font-weight: 700;
    }
    .save {
      margin: 0;
      padding: 0 16px 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    main {
      max-width: 46rem;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    h1 { font-size: 1.8rem; line-height: 1.3; margin: 0 0 8px; }
    h2 { font-size: 1.5rem; line-height: 1.35; margin: 0 0 8px; scroll-margin-top: 8rem; }
    h3 { font-size: 1.15rem; margin: 1.4rem 0 0.4rem; }
    p { margin: 0.4rem 0 0.8rem; }
    ol, ul { margin: 0.2rem 0 0.8rem; padding-left: 1.4rem; }
    li { margin: 0.25rem 0; }
    a { color: var(--accent); }
    button { font: inherit; cursor: pointer; }
    .lead { font-size: 1.05rem; }
    .choices { display: grid; gap: 12px; margin: 16px 0; }
    @media (min-width: 720px) {
      .choices { grid-template-columns: 1fr 1fr; }
    }
    .choice {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-height: 168px;
      padding: 18px;
      text-align: left;
      background: var(--card);
      border: 3px solid var(--accent);
      border-radius: 16px;
    }
    .choice:hover { background: #e8f1fb; }
    .choice-title { font-size: 1.45rem; font-weight: 700; }
    .choice-sub { font-size: 1rem; font-weight: 400; color: var(--muted); }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.92rem;
    }
    .nav button[aria-current="step"] {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }
    .nav button.is-done { border-color: var(--ok); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 4px;
      margin: 10px 0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f4;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 4px 4px 12px;
    }
    .copy, .ghost, .back {
      border: 1px solid var(--accent);
      background: var(--card);
      color: var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .copy { border-radius: 999px; padding: 6px 10px; font-size: 0.92rem; }
    .copy.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafaf9;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, "Cascadia Mono", "Yu Gothic", Meiryo, monospace;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .callout {
      background: var(--warn);
      border: 2px solid var(--warn-line);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0;
      font-weight: 700;
    }
    .callout.ok {
      background: var(--ok-bg);
      border-color: var(--ok);
      color: var(--ok);
    }
    .done-box {
      background: #f5f5f4;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 12px 0;
    }
    .check {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: 8px 0;
    }
    .check input { width: 1.35rem; height: 1.35rem; margin-top: 0.2rem; flex: none; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .next {
      flex: 1 1 16rem;
      min-height: 64px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1.35rem;
      font-weight: 700;
    }
    .back { min-height: 64px; padding: 8px 16px; font-size: 1.05rem; }
    .links { margin-top: 16px; }
    .links a { display: inline-block; margin: 4px 12px 4px 0; }
    :focus-visible { outline: 3px solid var(--warn-line); outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="top">
    <p class="brand">Discordサーバーキット。ダブルクリックで開きます。ネットもボットも不要です。</p>
    <p class="rule" id="permission-rule">拒否は@everyoneだけ。メンバー/選手ロールに赤を付けない。受付閉じは@everyoneの送信だけ拒否。</p>
    <p class="save" id="save-state"></p>
  </header>

    <p>手順を読み込んでいます。この表示のままなら、ブラウザの JavaScript をオンにして開き直してください。</p>
  </main>
  <noscript>
    <p>JavaScript をオンにして、このファイルを開き直してください。ネット接続は不要です。</p>

var copySeq = 0;
var copyMap = {};

function loadState() {
  var empty = { v: 1, pack: "", step: { fan: 0, event: 0 }, done: {}, checks: {} };
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return empty;
    var data = JSON.parse(raw);
    if (!data || data.v !== 1) return empty;
    if (!data.step) data.step = { fan: 0, event: 0 };
    if (!data.done) data.done = {};
    if (!data.checks) data.checks = {};
    if (data.pack !== "fan" && data.pack !== "event") data.pack = "";
    if (typeof data.step.fan !== "number") data.step.fan = 0;
    if (typeof data.step.event !== "number") data.step.event = 0;
    return data;
  } catch (err) {
    storageOk = false;
    return empty;
  }
}

var state = loadState();

function saveState() {
  var label = document.getElementById("save-state");
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    storageOk = true;
    if (label) label.textContent = "チェックはこのブラウザに残します。送信はしません。";
  } catch (err) {
    storageOk = false;
    if (label) label.textContent = "このブラウザではチェックを保存できません。開いたまま進めてください。";
  }
}

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () {
      return fallbackCopy(text);
    });
  }
  return Promise.resolve(fallbackCopy(text));
}

function fallbackCopy(text) {
  var area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  var ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (err) {
    ok = false;
  }
  document.body.removeChild(area);
  return ok;
}

function markCopied(button, ok) {
  var previous = button.textContent;
  button.textContent = ok ? "コピーしました" : "コピーできません";
  button.classList.toggle("done", ok);
  window.setTimeout(function () {
    button.textContent = previous;
    button.classList.remove("done");
  }, 1400);
}

function addCopy(parent, label, text) {
  copySeq += 1;
  var id = "c" + copySeq;
  copyMap[id] = text;
  var button = el("button", "copy", label);
  button.type = "button";
  button.dataset.copyId = id;
  parent.appendChild(button);
  return button;
}

function checkCount(step) {
  var total = 0;
  step.groups.forEach(function (group) { total += group.items.length; });
  return total;
}

function checkedCount(packId, step) {
  var n = 0;
  var total = checkCount(step);
  var i;
  for (i = 0; i < total; i += 1) {
    if (state.checks[packId + ":" + step.id + ":" + i]) n += 1;
  }
  return n;
}

function stepComplete(packId, step) {
  if (step.final) return checkedCount(packId, step) === checkCount(step);
  return !!state.done[packId + ":" + step.id];
}

function renderList(parent, tag, items) {
  var list = document.createElement(tag);
  items.forEach(function (item) {
    list.appendChild(el("li", "", item));
  });
  parent.appendChild(list);
}

function renderSections(parent, sections) {
  sections.forEach(function (section) {
    if (section.type === "steps" || section.type === "bullets") {
      parent.appendChild(el("h3", "", section.title));
      renderList(parent, section.type === "steps" ? "ol" : "ul", section.items);
      return;
    }
    if (section.type === "callout") {
      parent.appendChild(el("p", "callout", section.text));
      return;
    }
    if (section.type === "copies") {
      parent.appendChild(el("h3", "", section.title));
      var chips = el("div", "chips");
      section.items.forEach(function (name) {
        var chip = el("span", "chip");
        chip.appendChild(el("span", "", name));
        addCopy(chip, "コピー", name);
        chips.appendChild(chip);
      });
      parent.appendChild(chips);
      return;
    }
    if (section.type === "channels") {
      section.groups.forEach(function (group) {
        parent.appendChild(el("h3", "", group.category));
        var chips = el("div", "chips");
        group.items.forEach(function (pair) {
          var chip = el("span", "chip");
          chip.appendChild(el("span", "", pair[0] + "（" + pair[1] + "）"));
          addCopy(chip, "名前をコピー", pair[0]);
          chips.appendChild(chip);
        });
        parent.appendChild(chips);
      });
      return;
    }
    if (section.type === "cards") {
      parent.appendChild(el("h3", "", section.title));
      section.items.forEach(function (card) {
        var box = el("section", "card");
        box.appendChild(el("h3", "", card.title));
        renderList(box, "ul", card.lines);
        parent.appendChild(box);
      });
      return;
    }
    if (section.type === "pastes") {
      section.items.forEach(function (paste) {
        var box = el("section", "card");
        box.appendChild(el("h3", "", paste.title));
        box.appendChild(el("p", "", paste.where));
        var pre = document.createElement("pre");
        pre.textContent = paste.body;
        box.appendChild(pre);
        addCopy(box, "この文面をコピー", paste.body);
        parent.appendChild(box);
      });
    }
  });
}

function renderHome() {
  var app = document.getElementById("app");
  app.replaceChildren();
  document.title = "はじめての人へ — Discordサーバーキット";
  app.appendChild(el("h1", "", "どちらを作りますか"));
  app.appendChild(el("p", "lead", "選んだ方だけ進めれば大丈夫です。番号の付いた文書は詳細です。先に読まなくても、この画面でサーバーを作れます。"));
  var choices = el("div", "choices");
  [
    ["fan", "ファンコミュニティ", "配信や創作のファンが話すサーバー。ルール、自己紹介、雑談を作ります。"],
    ["event", "大会・カスタム", "対戦の受付と当日連絡のサーバー。参加受付、試合連絡、待機ボイスを作ります。"]
  ].forEach(function (row) {
    var button = el("button", "choice");
    button.type = "button";
    button.dataset.pack = row[0];
    button.appendChild(el("span", "choice-title", row[1]));
    button.appendChild(el("span", "choice-sub", row[2]));
    choices.appendChild(button);
  });
  app.appendChild(choices);
  app.appendChild(el("p", "", "文面の【　】は、自分の言葉に変えてから Discord に貼ります。最後のチェックが終わるまで、招待リンクは配りません。"));
  var reset = el("button", "ghost", "保存したチェックを消す");
  reset.type = "button";
  reset.id = "reset";
  app.appendChild(reset);
  var links = el("p", "links");
  links.appendChild(document.createTextNode("詳細（今は開かなくてよい）: "));
  [
    ["common/01-server-setup.md", "共通"],
    ["pack-fan/README.md", "ファン"],
    ["pack-event/README.md", "大会"]
  ].forEach(function (item, index) {
    if (index) links.appendChild(document.createTextNode(" / "));
    var a = document.createElement("a");
    a.href = item[0];
    a.textContent = item[1];
    links.appendChild(a);
  });
  app.appendChild(links);
}

function renderWizard() {
  var pack = PACKS[state.pack];
  var index = state.step[state.pack];
  if (index < 0 || index >= pack.steps.length) index = 0;
  state.step[state.pack] = index;
  var step = pack.steps[index];
  var app = document.getElementById("app");
  app.replaceChildren();
  copyMap = {};
  copySeq = 0;
  document.title = "手順" + (index + 1) + " " + step.title + " — はじめての人へ";

  var nav = el("div", "nav");
  pack.steps.forEach(function (item, itemIndex) {
    var button = el("button", "", String(itemIndex + 1) + " " + item.title);
    button.type = "button";
    button.dataset.gotoStep = String(itemIndex);
    if (itemIndex === index) button.setAttribute("aria-current", "step");
    if (stepComplete(pack.id, item)) button.classList.add("is-done");
    nav.appendChild(button);
  });
  app.appendChild(nav);

  var heading = el("h2", "", "手順" + (index + 1) + "　" + step.title);
  heading.tabIndex = -1;
  app.appendChild(heading);
  app.appendChild(el("p", "lead", step.lead));

  if (step.final) {
    var doneN = checkedCount(pack.id, step);
    var totalN = checkCount(step);
    var warn = el("p", doneN === totalN ? "callout ok" : "callout");
    warn.id = "invite-warn";
    warn.textContent = doneN === totalN
      ? "すべてのチェックが付きました。期限と回数を付けた招待だけを配ってください。"
      : "チェックが終わるまで招待しないでください。（" + doneN + " / " + totalN + "）";
    app.appendChild(warn);
    var running = 0;
    step.groups.forEach(function (group) {
      app.appendChild(el("h3", "", group.title));
      group.items.forEach(function (item) {
        var key = pack.id + ":" + step.id + ":" + running;
        var label = el("label", "check");
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!state.checks[key];
        input.dataset.checkKey = key;
        label.appendChild(input);
        label.appendChild(el("span", "", item));
        app.appendChild(label);
        running += 1;
      });
    });
    var linkRow = el("p", "links");
    step.links.forEach(function (item) {
      var a = document.createElement("a");
      a.href = item.href;
      a.textContent = item.label;
      linkRow.appendChild(a);
    });
    app.appendChild(linkRow);
  } else {
    renderSections(app, step.sections);
    var doneBox = el("div", "done-box");
    doneBox.appendChild(el("strong", "", "できた状態"));
    doneBox.appendChild(el("p", "", step.done));
    app.appendChild(doneBox);
    var label = el("label", "check");
    var input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!state.done[pack.id + ":" + step.id];
    input.dataset.doneKey = pack.id + ":" + step.id;
    label.appendChild(input);
    label.appendChild(el("span", "", "この手順は終わった"));
    app.appendChild(label);
  }

  var actions = el("div", "actions");
  var back = el("button", "back", index === 0 ? "用途の選択へ" : "戻る");
  back.type = "button";
  back.id = "back";
  var next = el("button", "next", "");
  next.type = "button";
  next.id = "next";
  if (step.final) {
    var complete = stepComplete(pack.id, step);
    next.textContent = complete ? "チェック完了" : "未チェックの項目へ";
  } else {
    next.textContent = index === pack.steps.length - 2 ? "公開前チェックへ" : "次へ";
  }
  actions.appendChild(back);
  actions.appendChild(next);
  app.appendChild(actions);
  window.scrollTo(0, 0);
  heading.focus();
}

function render() {
  if (!state.pack || !PACKS[state.pack]) renderHome();
  else renderWizard();
}

function refreshFinalBits() {
  var pack = PACKS[state.pack];
  if (!pack) return;
  var step = pack.steps[state.step[state.pack]];
  if (!step || !step.final) return;
  var doneN = checkedCount(pack.id, step);
  var totalN = checkCount(step);
  var warn = document.getElementById("invite-warn");
  var next = document.getElementById("next");
  if (warn) {
    var complete = doneN === totalN;
    warn.className = complete ? "callout ok" : "callout";
    warn.textContent = complete
      ? "すべてのチェックが付きました。期限と回数を付けた招待だけを配ってください。"
      : "チェックが終わるまで招待しないでください。（" + doneN + " / " + totalN + "）";
  }
  if (next) next.textContent = doneN === totalN ? "チェック完了" : "未チェックの項目へ";
  var buttons = document.querySelectorAll(".nav button");
  if (buttons[state.step[state.pack]]) {
    buttons[state.step[state.pack]].classList.toggle("is-done", doneN === totalN);
  }
}

document.body.addEventListener("click", function (event) {
  var button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.pack) {
    state.pack = button.dataset.pack;
    saveState();
    render();
    return;
  }
  if (button.id === "reset") {
    if (!window.confirm("保存したチェックを消しますか。")) return;
    state.pack = "";
    state.step = { fan: 0, event: 0 };
    state.done = {};
    state.checks = {};
    saveState();
    render();
    return;
  }
  if (button.dataset.copyId) {
    var text = copyMap[button.dataset.copyId];
    copyText(text).then(function (ok) { markCopied(button, !!ok); });
    return;
  }
  if (button.dataset.gotoStep) {
    state.step[state.pack] = Number(button.dataset.gotoStep);
    saveState();
    render();
    return;
  }
  if (button.id === "back") {
    if (state.step[state.pack] === 0) state.pack = "";
    else state.step[state.pack] -= 1;
    saveState();
    render();
    return;
  }
  if (button.id === "next") {
    var pack = PACKS[state.pack];
    var step = pack.steps[state.step[state.pack]];
    if (step.final) {
      var pending = document.querySelector('#app input[type="checkbox"]:not(:checked)');
      if (pending) {
        pending.focus();
        pending.scrollIntoView({ block: "center" });
      } else {
        var warn = document.getElementById("invite-warn");
        if (warn) warn.scrollIntoView({ block: "center" });
      }
      return;
    }
    state.step[state.pack] += 1;
    saveState();
    render();
  }
});

document.body.addEventListener("change", function (event) {
  var input = event.target;
  if (!input || input.type !== "checkbox") return;
  if (input.dataset.doneKey) state.done[input.dataset.doneKey] = input.checked;
  if (input.dataset.checkKey) state.checks[input.dataset.checkKey] = input.checked;
  saveState();
  var pack = PACKS[state.pack];
  if (!pack) return;
  var index = state.step[state.pack];
  var buttons = document.querySelectorAll(".nav button");
  if (buttons[index] && !pack.steps[index].final) {
    buttons[index].classList.toggle("is-done", !!state.done[pack.id + ":" + pack.steps[index].id]);
  }
  refreshFinalBits();
});

saveState();
render();
